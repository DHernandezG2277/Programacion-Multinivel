# Copia este archivo como config.properties (en la raíz del proyecto) y pon tus datos.
# config.properties NO se sube a GitHub (está en .gitignore); este .example sí.

# memoria | mariadb | mongo  -> la única línea que cambias para cambiar de motor
repositorio=memoria

mariadb.host=localhost
mariadb.puerto=3306
mariadb.base=rpg_manager
mariadb.usuario=root
mariadb.clave=TU_CLAVE

# Local: mongodb://localhost:27017
# Atlas: mongodb+srv://USUARIO:CLAVE@cluster0.xxxxx.mongodb.net
mongo.uri=mongodb://localhost:27017
mongo.base=rpg_manager
